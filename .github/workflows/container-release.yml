name: Build and Push Docker Images

on:
  release:
    types: [published]  # Trigger only on new releases

jobs:
  build-and-push-ddns-cloudflare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tags From Release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}/ddnscloudflare
          TAGS=$IMAGE_NAME:$RELEASE_TAG
          # Test releases are pre-releases and must not move :latest
          if [ "$PRERELEASE" != "true" ]; then TAGS=$TAGS,$IMAGE_NAME:latest; fi
          echo "TAGS=$TAGS" >> $GITHUB_ENV
          echo "GO_VERSION=$(grep -m1 '^go ' go.mod | cut -d' ' -f2)" >> $GITHUB_ENV

      - name: Build and Push the Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containerfiles/ddnsCloudflare.containerfile
          build-args: GO_VERSION=${{ env.GO_VERSION }}
          push: true
          tags: ${{ env.TAGS }}

  build-and-push-jottad:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
